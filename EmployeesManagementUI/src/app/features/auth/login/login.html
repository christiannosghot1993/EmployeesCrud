<div class="mx-auto mt-10 max-w-md">
  <div class="rounded-xl bg-white p-8 shadow-sm ring-1 ring-slate-200">
    <h1 class="mb-6 text-2xl font-bold text-slate-900">Sign in</h1>

    @if (error()) {
      <div class="mb-4 rounded-md bg-red-50 px-4 py-3 text-sm text-red-700">{{ error() }}</div>
    }

    <form [formGroup]="form" (ngSubmit)="submit()" class="space-y-4">
      <div>
        <label for="username" class="mb-1 block text-sm font-medium text-slate-700">Username</label>
        <input
          id="username"
          type="text"
          formControlName="username"
          class="w-full rounded-md border border-slate-300 px-3 py-2 focus:border-slate-500 focus:outline-none"
        />
        @if (form.controls.username.touched && form.controls.username.invalid) {
          <p class="mt-1 text-xs text-red-600">Username is required.</p>
        }
      </div>

      <div>
        <label for="password" class="mb-1 block text-sm font-medium text-slate-700">Password</label>
        <input
          id="password"
          type="password"
          formControlName="password"
          class="w-full rounded-md border border-slate-300 px-3 py-2 focus:border-slate-500 focus:outline-none"
        />
        @if (form.controls.password.touched && form.controls.password.invalid) {
          <p class="mt-1 text-xs text-red-600">Password is required.</p>
        }
      </div>

      <button
        type="submit"
        [disabled]="loading()"
        class="w-full rounded-md bg-slate-900 px-4 py-2 font-medium text-white hover:bg-slate-800 disabled:opacity-60"
      >
        {{ loading() ? 'Signing in…' : 'Sign in' }}
      </button>
    </form>

    <p class="mt-6 text-center text-sm text-slate-600">
      No account?
      <a routerLink="/register" class="font-medium text-slate-900 hover:underline">Create one</a>
    </p>
  </div>
</div>
